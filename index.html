                  ? "cooling down · " + (st.permSecCooldownUntil - day) + "d"
                  : "+" + PERMSEC_CONF_BOOST + " Confidence · political cost only"}
              </div>
            </button>
          </div>

          {selPol && !gameOver && (
            <div style={{ marginTop:16,padding:10,background:"#0c150c",
              border:`1px solid ${C.border}`,borderRadius:3 }}>
              <div style={{ fontSize:8,letterSpacing:3,color:C.faint,marginBottom:6 }}>SELECTED</div>
              <div style={{ fontSize:10,color:C.text,lineHeight:1.4,marginBottom:5 }}>{selPol.name}</div>
              {selPol.condition
                ? <div style={{ fontSize:8,color:selPol.condition.color,marginBottom:5 }}>{selPol.condition.label}</div>
                : <div style={{ fontSize:8,color:C.dim,marginBottom:5 }}>Business as usual</div>
              }
              <div style={{ fontSize:9,color:C.dim,marginBottom:5 }}>{STAGES[selPol.stage]}</div>
              <div style={{ fontSize:8,color:C.faint,marginBottom:8 }}>
                Submissions: <span style={{ color:selPol.submissions.development?C.green:C.dim }}>
                  {selPol.submissions.development||"dev pending"}</span>
                {" / "}
                <span style={{ color:selPol.submissions.signoff?C.green:C.dim }}>
                  {selPol.submissions.signoff||"S-O pending"}</span>
              </div>
              {selPol.awaitingHMT && (
                <div style={{ fontSize:8,color:C.amber,marginBottom:6 }}>⏳ Awaiting HMT response</div>
              )}
              {/* Overtime toggle */}
              {!selPol.awaitingHMT && (
                <div style={{ borderTop:`1px solid ${C.faint}`, paddingTop:7, marginTop:5 }}>
                  {selPol.overtimeStages[selPol.stage] ? (
                    <div style={{ fontSize:8, color:C.pink, lineHeight:1.5 }}>
                      🌙 Overtime active at {STAGES[selPol.stage]}<br/>
                      25% faster · staff will be fatigued after
                    </div>
                  ) : (
                    <button onClick={toggleOvertime}
                      disabled={res.adminBudget < OVERTIME_COST}
                      style={{
                        width:"100%", padding:"5px 7px", fontFamily:C.mono, fontSize:9,
                        background: res.adminBudget>=OVERTIME_COST ? "transparent" : "#1a1a0a",
                        border:`1px solid ${res.adminBudget>=OVERTIME_COST ? C.pink+"60" : C.faint}`,
                        color: res.adminBudget>=OVERTIME_COST ? C.pink : C.faint,
                        cursor: res.adminBudget>=OVERTIME_COST ? "pointer" : "not-allowed",
                        borderRadius:2, textAlign:"left",
                      }}>
                      🌙 Authorise overtime
                      <div style={{ fontSize:7, color:C.dim, marginTop:2, lineHeight:1.3 }}>
                        −{OVERTIME_COST} Admin · 25% faster<br/>this stage only · −wellbeing
                      </div>
                    </button>
                  )}
                </div>
              )}
            </div>
          )}
        </div>

        {/* CENTRE */}
        <div style={{ flex:1,padding:14,overflowY:"auto" }}>
          {gameOver ? (
            <div style={{ display:"flex",alignItems:"center",justifyContent:"center",
              height:"100%",textAlign:"center" }}>
              <div style={{ maxWidth:420 }}>
                <div style={{ fontSize:17,letterSpacing:3,marginBottom:16,
                  color:outcome==="won"?C.green:C.red }}>
                  {outcome==="won"?"PERFORMANCE REVIEW: OUTSTANDING":"PERFORMANCE REVIEW: UNSATISFACTORY"}
                </div>
                <div style={{ fontSize:12,color:C.dim,lineHeight:2,marginBottom:26,fontStyle:"italic" }}>"{outcomeMsg}"</div>
                <button onClick={()=>set(init())} style={{
                  padding:"8px 22px",background:C.faint,
                  border:`1px solid ${C.green}`,color:C.green,
                  cursor:"pointer",fontFamily:C.mono,fontSize:11,letterSpacing:2 }}>
                  NEW POSTING
                </button>
              </div>
            </div>
          ) : (
            <>
              {spadNotifs.length > 0 && (
                <div style={{ marginBottom:12 }}>
                  <div style={{ fontSize:8,letterSpacing:3,color:C.faint,marginBottom:8 }}>SPAD MESSAGES</div>
                  {spadNotifs.map(n => (
                    <SpadCard key={n.id} notif={n} policies={policies} onChoose={onSpadChoose} />
                  ))}
                </div>
              )}

              {/* PS advisory cards */}
              {psCards.length > 0 && (
                <div style={{ marginBottom:12 }}>
                  <div style={{ fontSize:8,letterSpacing:3,color:C.green,marginBottom:8 }}>
                    PRIVATE SECRETARY
                  </div>
                  {psCards.map(c => (
                    <PSCard key={c.id} card={c} onAction={onPSAction} />
                  ))}
                </div>
              )}

              <PressStrip pressCards={st.pressCards || []} day={day} />

              <LiveStrip livePortfolio={livePortfolio} staff={staff} />

              <CorrespondenceStrip
                correspondence={correspondence}
                policies={policies}
                hasCD={staff.some(s => s.type === "Correspondence Drafter" && !s.pending)}
                psHandlingManually={psHandlingManually}
                onEasy={onCorrEasy}
                onMed={onCorrMed}
                onHard={onHardCorrOpen}
              />

              <div style={{ fontSize:8,letterSpacing:3,color:C.faint,marginBottom:10 }}>
                POLICY INBOX ({policies.length} active)
              </div>
              <div style={{ display:"flex",flexDirection:"column",gap:10 }}>
                {policies.map(pol => {
                  const assigned = staff.filter(st => st.assignments.some(a => a.policyId === pol.id));
                  const isSel    = selected === pol.id;
                  const essT     = essentialType(pol, pol.stage);
                  const subPend  = needsSubmission(pol);
                  const otStage  = pol.overtimeStages?.[pol.stage];
                  return (
                    <div key={pol.id} onClick={()=>selectPolicy(pol.id)}
                      style={{
                        padding:"11px 13px",cursor:"pointer",borderRadius:3,
                        background:isSel?"#131f13":"#0c140c",
                        border:`1px solid ${isSel?C.green:C.border}`,
                        borderLeft:`3px solid ${pol.condition?pol.condition.color:C.faint}`,
                      }}>
                      <div style={{ display:"flex",justifyContent:"space-between",
                        alignItems:"flex-start",marginBottom:2 }}>
                        <div style={{ flex:1,marginRight:10 }}>
                          <div style={{ fontSize:12,color:C.text,fontWeight:"bold",marginBottom:3 }}>
                            {pol.name}
                            {pol.secrecy > 0 && <span style={{ marginLeft:8, fontSize:9 }} title={secrecyLabel(pol.secrecy)}>{secrecyIcon(pol.secrecy)}</span>}
                            {otStage && <span style={{ color:C.pink, marginLeft:8, fontSize:10 }}>🌙</span>}
                          </div>
                          {pol.condition
                            ? <span style={{ fontSize:8,color:pol.condition.color,letterSpacing:1 }}>{pol.condition.label}</span>
                            : <span style={{ fontSize:8,color:C.dim,letterSpacing:1 }}>Business as usual</span>
                          }
                          {pol.consulted && <span style={{ fontSize:8,color:C.green,marginLeft:8 }}>✓ consulted</span>}
                          {subPend && <span style={{ fontSize:8,color:C.purple,marginLeft:8 }}>📝 awaiting submission</span>}
                          {pol.awaitingHMT && <span style={{ fontSize:8,color:C.amber,marginLeft:8 }}>⏳ HMT review</span>}
                        </div>
                        <div style={{ display:"flex",gap:3,flexWrap:"wrap",
                          justifyContent:"flex-end",flexShrink:0,maxWidth:160 }}>
                          {assigned.map(w => {
                            const a   = w.assignments.find(x => x.policyId === pol.id);
                            const inT = a.transit > 0;
                            const ess = w.type === essT;
                            const sup = a.isSupport === true;
                            const shd = w.type === "Policy Officer" && !ess && !sup;
                            return (
                              <span key={w.id} style={{
                                fontSize:8,padding:"2px 5px",borderRadius:2,
                                background:inT?"#2a1f08":ess||sup?"#0d2318":shd?"#0d1a23":"#2d1010",
                                color:inT?C.amber:ess||sup?C.green:shd?C.blue:C.red,
                                border:`1px solid ${inT?C.amber+"40":ess||sup?C.green+"40":shd?C.blue+"40":C.red+"40"}`,
                                whiteSpace:"nowrap",
                              }}>
                                {w.initials}
                                {inT?` ↗${a.transit}d`:ess?" ●":sup?" ◐":shd?" ○":" ⚠"}
                              </span>
                            );
                          })}
                        </div>
                      </div>
                      <Pipeline policy={pol} staff={staff} />
                      {isSel && (
                        <div style={{ marginTop:8 }}>
                          {pol.condition && (
                            <div style={{ fontSize:9,color:C.dim,fontStyle:"italic",lineHeight:1.5,marginBottom:5 }}>
                              {pol.condition.desc}
                            </div>
                          )}
                          <div style={{ fontSize:8,color:C.faint }}>
                            <span style={{ color:C.green }}>●</span> essential ·{" "}
                            <span style={{ color:C.green }}>◐</span> support (½) ·{" "}
                            <span style={{ color:C.blue }}>○</span> shadowing (PO) ·{" "}
                            <span style={{ color:C.pink }}>🌙</span> overtime
                          </div>
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            </>
          )}
        </div>

        {/* RIGHT — staff + log */}
        <div style={{ width:235,borderLeft:`1px solid ${C.border}`,
          display:"flex",flexDirection:"column" }}>
          <div style={{ flex:1,padding:14,overflowY:"auto" }}>
            <div style={{ fontSize:8,letterSpacing:3,color:C.faint,marginBottom:10 }}>
              {/* Hire staff button */}
              {!gameOver && (() => {
                const psUnlocked = psTriggered?.firstLive;
                const isActive   = !!hiring;
                const hasCD      = staff.some(s => s.type === "Correspondence Drafter");
                const disabled   = !psUnlocked || isActive || hasCD;
                const label      = !psUnlocked ? "HIRE STAFF"
                                 : isActive    ? "RECRUITING…"
                                 : hasCD       ? "HIRE STAFF"
                                 :               "+ HIRE STAFF";
                const subtext    = !psUnlocked ? "Available after PS advice"
                                 : isActive    ? `${Math.max(0, hiring.startDay + RECRUITMENT_DAYS - day)}d remaining`
                                 : hasCD       ? "Correspondence Drafter in post"
                                 :               "";
                return (
                  <button
                    onClick={() => !disabled && addHiringModal("")}
                    style={{
                      width:"100%", padding:"5px 8px", marginBottom:8,
                      background:"transparent",
                      border:`1px dashed ${disabled ? C.faint : C.green}`,
                      color: disabled ? C.faint : C.green,
                      cursor: disabled ? "not-allowed" : "pointer",
                      fontFamily:C.mono, fontSize:9,
                      letterSpacing:1, textAlign:"left", borderRadius:2,
                      opacity: disabled ? 0.5 : 1,
                    }}>
                    {label}
                    {subtext && <span style={{ display:"block", fontSize:7, color:C.faint, marginTop:1 }}>{subtext}</span>}
                  </button>
                );
              })()}
              {selected?"STAFF — click to assign / unassign":"STAFF ROSTER"}
            </div>
            {staff.map(st => {
              const cap        = effectiveCapacity(st, day);
              const load       = staffLoad(st, policies);
              const pct        = (load/cap)*100;
              const onSel      = selected && st.assignments.some(a => a.policyId === selected);
              const wouldBlock = selPol && !onSel
                && st.type !== essentialType(selPol, selPol.stage)
                && st.type !== "Policy Officer";
              const wouldOver  = selPol && !onSel
                && load + assignmentWeight(st.type, selPol) > cap;
              const disabled   = wouldBlock || wouldOver;
              const wbCol      = st.wellbeing > 65 ? C.green
                              : st.wellbeing > 35 ? C.amber : C.red;
              const fatigued   = !!(st.fatigueUntil && day < st.fatigueUntil);
              return (
                <div key={st.id}
                  onClick={()=>selected&&!gameOver&&!disabled&&handleStaffClick(st.id)}
                  style={{
                    padding:"8px 10px",marginBottom:7,borderRadius:3,
                    cursor:selected&&!disabled?"pointer":"default",
                    background:onSel?"#182e18":st.isLocum?"#1f1a08":"#0c140c",
                    border:`1px solid ${onSel?C.green:st.isLocum?C.amber+"60":disabled&&selected?"#3a1515":C.border}`,
                    opacity:disabled&&selected?0.5:1,
                  }}>
                  <div style={{ display:"flex",justifyContent:"space-between",
                    alignItems:"center",marginBottom:5 }}>
                    <div>
                      <div style={{ fontSize:10,color:C.text }}>
                        {st.name}
                        {st.isLocum && <span style={{ fontSize:8,color:C.amber,marginLeft:5 }}>(locum)</span>}
                        {fatigued && <span style={{ fontSize:8,color:C.red,marginLeft:5 }}>(tired)</span>}
                      </div>
                      <div style={{ fontSize:8,color:C.dim,marginTop:1 }}>
                        {st.type}{st.isLocum&&` · departs ${st.expires-day}d`}
                      </div>
                    </div>
                    <div style={{ width:24,height:24,borderRadius:"50%",
                      background:onSel?C.faint:"#131f13",
                      border:`1px solid ${onSel?C.green:st.isLocum?C.amber+"60":C.faint}`,
                      display:"flex",alignItems:"center",justifyContent:"center",
                      fontSize:8,color:st.isLocum?C.amber:C.green,flexShrink:0 }}>
                      {st.initials}
                    </div>
                  </div>

                  {/* Load bar */}
                  <div style={{ display:"flex",justifyContent:"space-between",
                    fontSize:7,color:C.faint,marginBottom:2 }}>
                    <span>load</span>
                    <span style={{ color:pct>=90?C.red:C.dim }}>{load.toFixed(1)}/{cap}</span>
                  </div>
                  <div style={{ height:3,background:"#182818",borderRadius:1,
                    marginBottom:4,overflow:"hidden" }}>
                    <div style={{ height:"100%",width:`${Math.min(100,pct)}%`,
                      background:pct>=90?C.red:pct>=60?C.amber:C.green,
                      borderRadius:1,transition:"width 0.3s" }} />
                  </div>

                  {/* Wellbeing bar */}
                  {!st.isLocum && (
                    <>
                      <div style={{ display:"flex",justifyContent:"space-between",
                        fontSize:7,color:C.faint,marginBottom:2 }}>
                        <span>wellbeing</span>
                        <span style={{ color:wbCol }}>{Math.round(st.wellbeing)}</span>
                      </div>
                      <div style={{ height:3,background:"#182818",borderRadius:1,
                        marginBottom:5,overflow:"hidden" }}>
                        <div style={{ height:"100%",width:`${st.wellbeing}%`,
                          background:wbCol, borderRadius:1,transition:"width 0.3s" }} />
                      </div>
                    </>
                  )}

                  {st.assignments.length === 0 ? (
                    <div style={{ fontSize:8,color:C.faint }}>Available</div>
                  ) : (
                    <div style={{ display:"flex",flexDirection:"column",gap:1 }}>
                      {st.assignments.map(a => {
                        const ap = policies.find(p => p.id === a.policyId)
                          || (a.isMonitoring ? livePortfolio.find(lp => lp.id === a.policyId) : null);
                        const name = ap?.name || (a.isMonitoring ? "(live policy)" : "");
                        if (!name) return null;
                        const inT = a.transit > 0;
                        const mon = a.isMonitoring;
                        const sup = a.isSupport && !mon;
                        const shd = st.type==="Policy Officer" && !sup && !mon && ap && essentialType(ap,ap.stage)!=="Policy Officer";
                        return (
                          <div key={a.policyId} style={{
                            fontSize:8,lineHeight:1.4,
                            color:inT?C.amber:mon?"#7a7aaa":sup?C.green:shd?C.blue:C.green,
                          }}>
                            {inT?"↗":mon?"👁":sup?"◐":shd?"○":"●"}{" "}
                            {name.length>23?name.slice(0,23)+"…":name}
                            {inT&&` (${a.transit}d)`}
                          </div>
                        );
                      })}
                    </div>
                  )}
                  {/* Briefing tasks */}
                  {st.briefingTasks && st.briefingTasks.length > 0 && (
                    <div style={{ marginTop:4, paddingTop:3, borderTop:`1px dashed ${C.faint}` }}>
                      {st.briefingTasks.map((t, i) => (
                        <div key={i} style={{ fontSize:8, color:C.amber, lineHeight:1.4 }}>
                          📋 {t.label} ({t.daysLeft}d)
                        </div>
                      ))}
                    </div>
                  )}
                  {wouldBlock&&selected&&!onSel&&(
                    <div style={{ fontSize:8,color:C.red,marginTop:4 }}>Not essential for {STAGES[selPol.stage]}</div>
                  )}
                  {wouldOver&&!wouldBlock&&selected&&!onSel&&(
                    <div style={{ fontSize:8,color:C.red,marginTop:4 }}>At capacity</div>
                  )}
                </div>
              );
            })}
          </div>

          <div style={{ borderTop:`1px solid ${C.border}`,padding:"10px 12px",
            maxHeight:200,overflowY:"auto",background:"#070d07" }}>
            <div style={{ fontSize:8,letterSpacing:3,color:C.faint,marginBottom:8 }}>DEPARTMENTAL LOG</div>
            {log.map((e,i) => (
              <div key={i} style={{ display:"flex",gap:6,marginBottom:5,alignItems:"flex-start" }}>
                {e.tag && <span style={{ fontSize:8,flexShrink:0,whiteSpace:"nowrap",
                  color:e.type==="success"?C.green:e.type==="warn"?C.red:C.amber }}>{e.tag}</span>}
                <span style={{ fontSize:9,lineHeight:1.5,
                  color:e.type==="success"?C.green:e.type==="warn"?C.red:
                  e.type==="event"?C.amber:e.type==="intro"?C.green:C.dim }}>{e.text}</span>
              </div>
            ))}
          </div>
        </div>
      </div>

      {/* MODALS */}
      {activeModal?.type==="routing" && (
        <RoutingModal policy={modalPol} staff={staff} policies={policies}
          kind={activeModal.kind} day={day} onConfirm={onRoutingConfirm} />
      )}
      {activeModal?.type==="submission" && (
        <SubmissionModal policy={modalPol} stage={activeModal.stage} onSubmit={onSubmissionChoose} />
      )}
      {activeModal?.type==="htmResponse" && (
        <HTMModal modal={activeModal} policy={modalPol} onConfirm={onHTMConfirm} />
      )}
      {activeModal?.type==="deferredTrust" && (
        <DeferredTrustModal modal={activeModal} onClose={onDeferredTrustClose} />
      )}
      {activeModal?.type==="meeting" && (
        <MeetingModal policies={policies} res={res} completed={completed} onClose={onMeetingClose} />
      )}
      {activeModal?.type==="steer" && (
        <SteerModal modal={activeModal} policies={policies} onChoose={onSteerChoose} />
      )}
      {activeModal?.type==="foiRequest" && (
        <FOIModal modal={activeModal} onChoose={onFOIChoose} />
      )}
      {activeModal?.type==="leakStory" && (
        <LeakStoryModal modal={activeModal} onClose={onLeakStoryClose} />
      )}
      {activeModal?.type==="hiring" && (
        <HiringModal role={activeModal.role || "Correspondence Drafter"}
          onStart={() => onHiringStart(activeModal.role || "Correspondence Drafter")}
          onDismiss={() => set(s => popQueueOrResume(s))} />
      )}
      {activeModal?.type==="applicants" && (
        <ApplicantsModal applicants={activeModal.applicants} onChoose={onApplicantChoose} />
      )}
      {activeModal?.type==="hardCorrespondence" && (
        <HardCorrModal
          corr={correspondence.find(c => c.id === activeModal.corrId)}
          hasCD={staff.some(s => s.type === "Correspondence Drafter" && !s.pending)}
          onChoose={onHardCorrChoose} />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Whitehall />);
</script>
</body>
</html>
