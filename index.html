// ── Policy costs ─────────────────────────────────────────────────────────────
function calcCosts(policy) {
  if (!policy.condition) return { impl:12, run:2 };
  if (policy.condition.id === "HOT_POTATO")    return { impl:22, run:3 };
  if (policy.condition.id === "MINISTERS_PET") return { impl:14, run:2 };
  return { impl:18, run:2 };
}

function calculateHMT(policy) {
  const tone = policy.submissions.signoff || "CAUTIOUS";
  const w = SUBMISSION_TONES[tone].htmWeights;
  const r = Math.random();
  let response;
  if      (r < w.approved)            response = "approved";
  else if (r < w.approved + w.within) response = "within";
  else                                 response = "rejected";

  let rejectedTo = null;
  if (response === "rejected") {
    const rr = Math.random();
    if      (rr < 0.15) rejectedTo = 0;
    else if (rr < 0.50) rejectedTo = 1;
    else                rejectedTo = 2;
  }
  const { impl } = calcCosts(policy);
  return { response, rejectedTo, amount: impl };
}

function steerForState(policies, confidence) {
  const band = confidenceBand(confidence);
  const hots = policies.filter(p => p.condition?.id === "HOT_POTATO");
  const r = Math.random();

  // CRISIS: more demanding, push-back option disappears, costs are harsher
  if (band === "crisis") {
    if (hots.length > 0 && r < 0.6) {
      const p = pick(hots);
      return {
        subtype:"crisis_hotpotato", policyId:p.id,
        text:`We need to talk about ${p.name}. I've had three calls this morning. I need to know exactly what's happening and I need it now.`,
        options:[
          { label:"Brief in full detail",      confidence:+4, trust: 0, task:{ poId:null, days:TASK_BRIEF_PROPER+1, label:"crisis briefing" }, log:`Briefed the Minister in detail on ${p.name}.` },
          { label:"Apologetic verbal update",  confidence: 0, trust: 0, task:{ poId:null, days:TASK_BRIEF_VERBAL, label:"verbal update" }, log:`Verbal apology and update to the Minister on ${p.name}.` },
          { label:"Promise written follow-up", confidence:-4, trust: 0, task:{ poId:null, days:TASK_BRIEF_PROPER, label:"promised note" }, log:`Promised a follow-up note on ${p.name}. The Minister was not satisfied.` },
        ],
      };
    }
    const p = pick(policies);
    return {
      subtype:"crisis_check", policyId:p?.id || null,
      text:`I'm getting calls from the press office about ${p?.name || "the portfolio"} and I have nothing to tell them. Sort this out today.`,
      options:[
        { label:"Drop everything and brief",   confidence:+3, trust: 0, task:{ poId:p?.id || null, days:TASK_BRIEF_PROPER+1, label:"urgent brief" }, log:`Dropped everything to brief the Minister on ${p?.name || "the portfolio"}.` },
        { label:"Quick verbal summary",        confidence:-2, trust: 0, task:{ poId:p?.id || null, days:TASK_BRIEF_VERBAL, label:"quick brief" }, log:`Quick verbal to the Minister. Not enough.` },
        { label:"Defer with apology",          confidence:-5, trust: 0, log:`Couldn't respond to the Minister in time.` },
      ],
    };
  }

  // UNEASY: more frequent, push-back costs more, all options have meaningful costs
  if (band === "uneasy") {
    if (hots.length > 0 && r < 0.55) {
      const p = pick(hots);
      return {
        subtype:"uneasy_hotpotato", policyId:p.id,
        text:`I'm still uneasy about ${p.name}. The Mail piece this weekend wasn't helpful. Where are we?`,
        options:[
          { label:"Reassure with detail",  confidence:+5, trust: 0, task:{ poId:p.id, days:TASK_REASSURE_DETAIL, label:"reassurance note" }, log:`Briefed the Minister on ${p.name}.` },
          { label:"Acknowledge concerns",  confidence:+1, trust: 0, task:{ poId:p.id, days:TASK_ACK_CONCERNS, label:"holding note" }, log:`Acknowledged ministerial concerns on ${p.name}.` },
          { label:"Push back firmly",      confidence:-5, trust:+2, task:{ poId:p.id, days:TASK_PUSHBACK, label:"defence note" }, log:`Pushed back on the Minister. Cost some confidence.` },
        ],
      };
    }
    const p = pick(policies);
    return {
      subtype:"uneasy_check", policyId:p?.id || null,
      text:`I had questions at Cabinet about ${p?.name || "the digital portfolio"}. I'd like an update by close of play.`,
      options:[
        { label:"Brief properly",         confidence:+3, trust: 0, task:{ poId:p?.id || null, days:TASK_BRIEF_PROPER, label:"COP brief" }, log:`Sent full COP brief on ${p?.name || "the portfolio"}.` },
        { label:"Verbal summary",         confidence: 0, trust: 0, task:{ poId:p?.id || null, days:TASK_BRIEF_VERBAL, label:"verbal" }, log:`Verbal summary to the Minister.` },
        { label:"Apologise — too busy",   confidence:-3, trust: 0, log:`Couldn't brief the Minister on ${p?.name || "the portfolio"}.` },
      ],
    };
  }

  // COMFORTABLE: original steers, push-back available, generic option works
  if (hots.length > 0 && r < 0.5) {
    const p = pick(hots);
    return {
      subtype:"hotpotato", policyId:p.id,
      text:`I've been reading the briefing on ${p.name}. The Mail are sniffing around. Where are we?`,
      options:[
        { label:"Reassure with detail",  confidence:+6, trust: 0, task:{ poId:p.id, days:TASK_REASSURE_DETAIL, label:"reassurance note" }, log:`Briefed the Minister thoroughly on ${p.name}.` },
        { label:"Acknowledge concerns",  confidence:+2, trust: 0, task:{ poId:p.id, days:TASK_ACK_CONCERNS, label:"holding note" }, log:`Acknowledged ministerial concerns on ${p.name}.` },
        { label:"Push back firmly",      confidence:-3, trust:+3, task:{ poId:p.id, days:TASK_PUSHBACK, label:"defence note" }, log:`Pushed back — the policy is sound.` },
      ],
    };
  }
  if (policies.length > 0 && r < 0.85) {
    const p = pick(policies);
    return {
      subtype:"check", policyId:p.id,
      text:`Quick one — I had a question on ${p.name} at Cabinet. Where are we with it?`,
      options:[
        { label:"Brief properly",        confidence:+4, trust: 0, task:{ poId:p.id, days:TASK_BRIEF_PROPER, label:"update note" }, log:`Sent a full update note on ${p.name}.` },
        { label:"Verbal summary",        confidence:+1, trust: 0, task:{ poId:p.id, days:TASK_BRIEF_VERBAL, label:"verbal" }, log:`Gave a verbal summary on ${p.name}.` },
        { label:"Apologise — too busy",  confidence:-2, trust: 0, log:`Could not brief the Minister on ${p.name} in time.` },
      ],
    };
  }
  return {
    subtype:"generic", policyId:null,
    text:`I had dinner with a journalist yesterday. They were asking pointed questions about the department. Are we on top of things?`,
    options:[
      { label:"Run through the portfolio",   confidence:+3, trust: 0, task:{ poId:null, days:TASK_PORTFOLIO_RUN, label:"portfolio note" }, log:"Walked the Minister through the portfolio." },
      { label:"Reassure briefly",            confidence:+1, trust: 0, task:{ poId:null, days:TASK_REASSURE_BRIEFLY, label:"verbal" }, log:"Reassured the Minister briefly." },
      { label:"Suggest they speak to comms", confidence:-1, trust: 0, log:"Suggested the Minister speak to the comms team." },
    ],
  };
}

function spadIntervention(policies, day, confidence) {
  if (policies.length === 0) return null;
  const band = confidenceBand(confidence);
  const p = pick(policies);
  const r = Math.random();

  // In crisis, Deflect becomes costly; in uneasy, it's slightly costly
  const deflectCost = band === "crisis" ? -3 : band === "uneasy" ? -1 : 0;

  if (r < 0.35) return {
    id:`spad-${day}`, policyId:p.id, expires:day+SPAD_EXPIRY,
    text:`Hey — any chance we add a digital component to ${p.name}? Would play well with under-40s.`,
    options:[
      { label:"Accept",   confidence:+2, trust:-2, task:{ poId:p.id, days:TASK_SPAD_ACCEPT, label:"SpAd rework" }, log:`Agreed to JM's digital framing for ${p.name}.` },
      { label:"Deflect",  confidence:deflectCost, trust: 0, log:`Deflected JM on ${p.name}.${deflectCost<0?" She noticed.":""}` },
      { label:"Escalate", confidence:-4, trust:+1, task:{ poId:p.id, days:TASK_SPAD_ESCALATE, label:"escalation note" }, log:`Escalated JM's request to the Perm Sec.`, reducesFuture:true },
    ],
  };
  if (r < 0.7) return {
    id:`spad-${day}`, policyId:p.id, expires:day+SPAD_EXPIRY,
    text:`Conference is coming up. Is there any way to get an announcement on ${p.name} before then?`,
    options:[
      { label:"We'll try", confidence:+3, trust:-2, task:{ poId:p.id, days:TASK_SPAD_ACCEPT, label:"acceleration plan" }, log:`Committed to accelerating ${p.name} for conference.` },
      { label:"Deflect",   confidence:deflectCost, trust: 0, log:`Deflected JM's conference push on ${p.name}.${deflectCost<0?" She is taking notice.":""}` },
      { label:"Escalate",  confidence:-4, trust:+1, task:{ poId:p.id, days:TASK_SPAD_ESCALATE, label:"escalation note" }, log:`Escalated JM's conference push to Perm Sec.`, reducesFuture:true },
    ],
  };
  return {
    id:`spad-${day}`, policyId:p.id, expires:day+SPAD_EXPIRY,
    text:`I had lunch with the Treasury SpAds. They say ${p.name} could be a real win if we frame it right.`,
    options:[
      { label:"Engage",  confidence:+2, trust:-1, task:{ poId:p.id, days:TASK_SPAD_ACCEPT, label:"reframing note" }, log:`Engaged with JM's framing of ${p.name}.` },
      { label:"Deflect", confidence:deflectCost, trust: 0, log:`Deflected JM on ${p.name}.${deflectCost<0?" She raised eyebrows.":""}` },
      { label:"Escalate",confidence:-4, trust:+1, task:{ poId:p.id, days:TASK_SPAD_ESCALATE, label:"escalation note" }, log:`Escalated JM's framing to Perm Sec.`, reducesFuture:true },
    ],
  };
}

function meetingLines(policies, res, completed) {
  let dConf = 0; const lines = [];
  if (completed >= 3) { lines.push(`"Good to see real progress — ${completed} policies through the system."`); dConf += 4; }
  const hots = policies.filter(p => p.condition?.id === "HOT_POTATO").length;
  if (hots >= 2)     { lines.push(`"I'm uneasy about how many flashpoints we're carrying. Be careful."`); dConf -= 5; }
  else if (hots===1) { lines.push(`"Keep me close on the sensitive one. No surprises."`); dConf -= 1; }
  const stalled = policies.filter(p => p.stage > 0 && p.progress < 10).length;
  if (stalled >= 2)  { lines.push(`"Why are so many of these stuck? Let's talk about resourcing."`); dConf -= 4; }
  if (res.adminBudget < 30 || res.programmeBudget < 30) {
    lines.push(`"The Permanent Secretary mentioned the budget situation. Get a grip on it."`); dConf -= 3;
  }
  if (res.trust > 75) { lines.push(`"The select committee was rather complimentary, I gather."`); dConf += 3; }
  if (lines.length === 0) { lines.push(`"Steady week. Keep me informed."`); dConf += 1; }
  return { dConf, lines };
}

// ── Helpers ──────────────────────────────────────────────────────────────────
const cl   = n => Math.max(0, Math.min(100, n));
const pick = a => a[Math.floor(Math.random() * a.length)];
let _uid   = 0;

function fmtDate(day) {
  const d = new Date(START);
  d.setDate(d.getDate() + day);
  return d.toLocaleDateString("en-GB", { day:"numeric", month:"short", year:"numeric" });
}

function policyWeight(p) { return p.condition ? 2 : 1; }

function essentialType(policy, stage) {
  if (policy.condition?.id === "RED_TAPE") return "Lawyer";
  switch (stage) {
    case 0:
      if (policy.condition?.id === "CONSULTATION" && !policy.consulted) return "Stakeholder Mgr";
      return "Data Analyst";
    case 1: return "Policy Officer";
    case 2: return "Lawyer";
    case 3: return "Delivery Mgr";
    default: return "Policy Officer";
  }
}

function isEssentialNow(staffType, policy) {
  return essentialType(policy, policy.stage) === staffType;
}

function assignmentWeight(staffType, policy) {
  const w = policyWeight(policy);
  if (staffType === "Policy Officer" && !isEssentialNow(staffType, policy)) return w * SUPPORT_FACTOR;
  return w;
}

function effectiveCapacity(st, day) {
  let c = CAPACITY[st.type];
  if (st.fatigueUntil && day < st.fatigueUntil) c -= FATIGUE_CAP_HIT;
  return Math.max(1, c);
}

// Total active briefing-task days currently on a staff member
function briefingTaskLoad(st) {
  if (!st.briefingTasks || st.briefingTasks.length === 0) return 0;
  // Each ongoing task reduces effective contribution by 1 capacity unit
  return st.briefingTasks.length;
}

// Apply a briefing task to a staff member by policy preference
function applyBriefingTask(staff, policies, task, leadPOFinder) {
  if (!task || task.days <= 0) return;
  // Find best target: if task.poId set, find that policy's lead PO; otherwise any least-loaded PO
  let target = null;
  if (task.poId) {
    const pol = policies.find(p => p.id === task.poId);
    if (pol) {
      target = staff.find(s =>
        s.type === "Policy Officer" &&
        s.assignments.some(a => a.policyId === task.poId && !a.isSupport));
    }
  }
  if (!target) {
    // Least loaded PO
    const pos = staff.filter(s => s.type === "Policy Officer");
    pos.sort((a,b) => (a.briefingTasks?.length||0) - (b.briefingTasks?.length||0));
    target = pos[0];
  }
  if (!target) return;
  if (!target.briefingTasks) target.briefingTasks = [];
  target.briefingTasks.push({ daysLeft: task.days, label: task.label });
}

function staffLoad(st, policies) {
  return st.assignments.reduce((sum, a) => {
    if (a.isMonitoring) return sum + LIVE_MONITOR_WT;
    const p = policies.find(pp => pp.id === a.policyId);
    if (!p) return sum;
    return sum + assignmentWeight(st.type, p);
  }, 0);
}

function findHandler(type, staff, policy, policies, day) {
  const w = assignmentWeight(type, policy);
  const cands = staff.filter(s => s.type === type);
  cands.sort((a, b) => staffLoad(a, policies) - staffLoad(b, policies));
  for (const c of cands) {
    if (staffLoad(c, policies) + w <= effectiveCapacity(c, day)) return c;
  }
  return null;
}

function findHandlerForced(type, staff, policies) {
  const cands = staff.filter(s => s.type === type);
  if (!cands.length) return null;
  cands.sort((a, b) => staffLoad(a, policies) - staffLoad(b, policies));
  return cands[0];
}

function findSupportPO(policy, staff, policies, day) {
  const w = policyWeight(policy) * SUPPORT_FACTOR;
  const cands = staff.filter(s =>
    s.type === "Policy Officer" &&
    !s.assignments.some(a => a.policyId === policy.id));
  cands.sort((a, b) => staffLoad(a, policies) - staffLoad(b, policies));
  for (const c of cands) {
    if (staffLoad(c, policies) + w <= effectiveCapacity(c, day || 0)) return c;
  }
  return null;
}

function tryAddSupportPO(policy, staff, policies, day) {
  const s = findSupportPO(policy, staff, policies, day);
  if (!s) return false;
  s.assignments.push({ policyId: policy.id, transit: TRANSIT_IDLE, isSupport: true });
  return true;
}

function ensurePOCoverage(staff, policies) {
  const next = staff.map(s => ({ ...s, assignments: [...s.assignments] }));
  policies.forEach(pol => {
    const hasPO = next.some(s => s.type === "Policy Officer" && s.assignments.some(a => a.policyId === pol.id));
    if (!hasPO) {
      const po = findHandlerForced("Policy Officer", next, policies);
      if (po) po.assignments.push({ policyId: pol.id, transit: TRANSIT_IDLE });
    }
  });
  return next;
}

function computeRouting(policy, staff, policies, day) {
  const simStaff = staff.map(s => ({ ...s, assignments: s.assignments.filter(a => a.policyId !== policy.id) }));
  const poCands  = simStaff.filter(s => s.type === "Policy Officer");
  poCands.sort((a, b) => staffLoad(a, policies) - staffLoad(b, policies));
  const constantPO = poCands[0] || null;
  if (constantPO) simStaff.find(s => s.id === constantPO.id).assignments.push({ policyId: policy.id, transit: 0 });

  const route = [];
  for (let stage = 0; stage <= 3; stage++) {
    const simPol = { ...policy, stage, consulted: stage > 0 || policy.consulted };
    const essType = essentialType(simPol, stage);
    let essential = essType === "Policy Officer" ? constantPO
      : findHandler(essType, simStaff, simPol, policies, day);
    if (essential && essType !== "Policy Officer") {
      simStaff.find(s => s.id === essential.id).assignments.push({ policyId: policy.id, transit: 0 });
    }
    route.push({
      stage, essType, essential,
      support: constantPO && essential && constantPO.id !== essential.id ? constantPO : null,
    });
  }
  return route;
}

function mkPol(name, condition, stage = 0, progress = 0, consulted = false, submissions = null, supportConfig = null, secrecy = 0) {
  return {
    id:`p${_uid++}`, name, condition, stage, progress, consulted,
    submissions: submissions || { development: null, signoff: null },
    supportConfig: supportConfig || [false, false, false, false],
    overtimeStages: [false, false, false, false],
    awaitingHMT: false,
    secrecy,
  };
}

function randomPolicy() {
  const entry = pick(POOL);
  const cond = Math.random() < 0.45 ? pick(Object.values(CONDITIONS)) : null;
  return mkPol(entry.name, cond, 0, 0, false, null, null, entry.secrecy);
}

function startingPortfolio() {
  return [
    mkPol(POOL[0].name, null, 0, 0, false, null, null, POOL[0].secrecy),
    mkPol(POOL[1].name, null, 0, 0, false, null, null, POOL[1].secrecy),
  ];
}

function autoAssignAll(policies, freshStaff) {
  let staff = freshStaff.map(s => ({ ...s, assignments: [],
    wellbeing: WELLBEING_INIT, fatigueUntil: 0, briefingTasks: [] }));
  policies.forEach(pol => {
    const po = findHandlerForced("Policy Officer", staff, policies);
    if (po) po.assignments.push({ policyId: pol.id, transit: 0 });
  });
  policies.forEach(pol => {
    const essType = essentialType(pol, pol.stage);
    if (essType === "Policy Officer") return;
    const h = findHandler(essType, staff, pol, policies, 0);
    if (h) h.assignments.push({ policyId: pol.id, transit: 0 });
  });
  return staff;
}

function needsSubmission(pol) {
  if (pol.stage === 1 && !pol.submissions.development) return "development";
  if (pol.stage === 2 && !pol.submissions.signoff)     return "signoff";
  return null;
}

// ── Init ─────────────────────────────────────────────────────────────────────
function init() {
  _uid = 0;
  const pols  = startingPortfolio();
  const staff = autoAssignAll(pols, STAFF_DEFS);
  return {
    day:           0,
    speed:         "pause",
    prevSpeed:     "play",         // resume speed when modal closes
    res:           { adminBudget:75, capitalBudget:50, programmeBudget:80, confidence:80, trust:70 },
    policies:      pols,
    staff,
    livePortfolio: [],
    completed:     0,
    log: [{ text:"Digital Delivery Unit opened. Two intake policies have arrived. Assign staff and review before pressing Play.", type:"intro" }],
    selected:      null,
    nextEvent:     12,
    nextHot:       5,
    nextPet:       999,
    nextArrival:   7 + Math.floor(Math.random() * 5),
    nextMeeting:   MEETING_INTERVAL,
    nextSteer:     STEER_INT_MIN + Math.floor(Math.random() * (STEER_INT_MAX - STEER_INT_MIN)),
    nextSpad:      SPAD_INT_MIN  + Math.floor(Math.random() * (SPAD_INT_MAX  - SPAD_INT_MIN)),
    modalQueue:    [],
    activeModal:   null,
    spadNotifs:    [],
    spadEscalations: 0,
    permSecCooldownUntil: 0,
    pendingLeaks:  [],          // Perm Sec leaks waiting to fire
    pendingFOIs:   [],          // FOI follow-up checks waiting to fire
    foiQueue:      [],          // FOI requests awaiting player decision
    pressCards:    [],          // active press / correspondence cards
    bilateralPenalty: 0,        // applied at next bilateral
    nextFOI:       FOI_INTERVAL_MIN + Math.floor(Math.random() * (FOI_INTERVAL_MAX - FOI_INTERVAL_MIN)),
    // PS / hiring / correspondence
    psCards:          [],
    psTriggered:      {},
    hiring:           null,
    correspondence:   [],
    nextCorrEasy:     CORR_EASY_INT_MIN + Math.floor(Math.random() * (CORR_EASY_INT_MAX - CORR_EASY_INT_MIN)),
    nextCorrMed:      CORR_MED_INT + Math.floor(Math.random() * 5),
    nextCorrHard:     CORR_HARD_INT + Math.floor(Math.random() * 7),
    psHandlingManually:  false,
    psHandlingDrainNext: 0,
    gameOver:      false,
    outcome:       null,
    outcomeMsg:    "",
  };
}

// ── Helpers for tick ─────────────────────────────────────────────────────────
function advanceToImpl(pol, staff, pols, day) {
  staff.forEach(st => {
    if (st.type !== "Policy Officer") {
      st.assignments = st.assignments.filter(a => a.policyId !== pol.id);
    } else {
      st.assignments = st.assignments.filter(a => a.policyId !== pol.id || !a.isSupport);
    }
  });
  pol.awaitingHMT = false;
  pol.stage       = 3;
  pol.progress    = 0;
  const h = findHandler("Delivery Mgr", staff, pol, pols, day);
  if (h) h.assignments.push({ policyId: pol.id, transit: TRANSIT_IDLE });
  if (pol.supportConfig[3]) tryAddSupportPO(pol, staff, pols, day);
}

function applyOvertimeStart(staff, pol) {
  // Apply wellbeing impact to all staff currently assigned to this policy who are essential here
  const essT = essentialType(pol, pol.stage);
  staff.forEach(st => {
    const a = st.assignments.find(x => x.policyId === pol.id);
    if (!a) return;
    if (st.type === essT || a.isSupport) {
      st.wellbeing = cl(st.wellbeing + WELLBEING_OVERTIME);
    }
  });
}

function applyOvertimeFinish(staff, pol, day) {
  // After a stage completes under overtime, the essential staff get a fatigue period
  const essT = essentialType(pol, pol.stage);
  staff.forEach(st => {
    const a = st.assignments.find(x => x.policyId === pol.id);
    if (!a) return;
    if (st.type === essT) {
      st.fatigueUntil = day + FATIGUE_DURATION;
    }
  });
}

// ── Tick ─────────────────────────────────────────────────────────────────────
function tick(s) {
  if (s.gameOver || s.activeModal) return s;

  const day = s.day + 1;
  let res   = { ...s.res };
  let staff = s.staff.map(st => ({ ...st,
    assignments: st.assignments.map(a => ({ ...a })),
    briefingTasks: (st.briefingTasks || []).map(t => ({ ...t })),
  }));
  let pols  = s.policies.map(p => ({ ...p,
    submissions:{ ...p.submissions },
    overtimeStages:[...(p.overtimeStages||[false,false,false,false])] }));
  let live  = s.livePortfolio.map(lp => ({ ...lp }));
  let done  = s.completed;
  let log   = [...s.log];
  let { nextEvent, nextHot, nextPet, nextArrival,
        nextMeeting, nextSteer, nextSpad, spadNotifs, spadEscalations,
        pendingLeaks, pendingFOIs, foiQueue, pressCards,
        bilateralPenalty, nextFOI,
        psCards, psTriggered, hiring, correspondence,
        nextCorrEasy, nextCorrMed, nextCorrHard,
        psHandlingManually, psHandlingDrainNext } = s;
  pendingLeaks  = [...pendingLeaks];
  pendingFOIs   = [...pendingFOIs];
  foiQueue      = [...foiQueue];
  pressCards    = pressCards.filter(p => day < p.expires);
  psCards       = [...psCards];
  correspondence = correspondence.map(c => ({ ...c }));

  let newModals = [];
  let pendingModal = null;
  function addModal(m) { if (!pendingModal) pendingModal = m; else newModals.push(m); }

  spadNotifs = [...spadNotifs];

  // 0a. Activate pending hires after notice period
  staff = staff.map(st => {
    if (st.pending && day >= st.startDay) {
      const { pending, ...rest } = st;
      log = [{ text:`${st.name} has joined the team as ${st.type}.`, tag:"✓ Started", type:"success" }, ...log];
      return rest;
    }
    return st;
  });

  // 0. Expire locums
  staff.filter(st => st.isLocum && day >= st.expires).forEach(locum => {
    locum.assignments.forEach(a => {
      const pol = pols.find(p => p.id === a.policyId);
      if (!pol) return;
      const reg = staff.find(s2 => s2.type === "Lawyer" && !s2.isLocum
        && !s2.assignments.some(x => x.policyId === a.policyId)
        && staffLoad(s2, pols) + assignmentWeight("Lawyer", pol) <= effectiveCapacity(s2, day));
      if (reg) reg.assignments.push({ policyId: a.policyId, transit: TRANSIT_SWAP });
    });
    log = [{ text:`Locum Counsel returned to GLD.`, tag:"Locum", type:"warn" }, ...log];
  });
  staff = staff.filter(st => !(st.isLocum && day >= st.expires));

  // 0b. Expire SpAd notifs
  spadNotifs = spadNotifs.filter(n => {
    if (day >= n.expires) {
      res.confidence = cl(res.confidence - 1);
      return false;
    }
    return true;
  });

  // 1. Transit countdown & briefing task countdown
  staff.forEach(st => {
    st.assignments.forEach(a => { if (a.transit > 0) a.transit--; });
    if (st.briefingTasks && st.briefingTasks.length > 0) {
      st.briefingTasks.forEach(t => t.daysLeft--);
      st.briefingTasks = st.briefingTasks.filter(t => t.daysLeft > 0);
    }
  });

  // 2. Wellbeing dynamics (per-tick)
  staff.forEach(st => {
    const load = staffLoad(st, pols);
    const cap  = effectiveCapacity(st, day);
    const ratio = cap > 0 ? load / cap : 0;
    if (ratio > WELLBEING_HIGH_CAP_THR) {
      // Slight ongoing wellbeing drain when working at >75%
      st.wellbeing = cl(st.wellbeing + WELLBEING_HIGH_CAP_LOSS * (ratio - WELLBEING_HIGH_CAP_THR) * 4);
    } else if (ratio < 0.4) {
      // Quiet day — modest recovery
      st.wellbeing = cl(st.wellbeing + WELLBEING_RECOVERY_R);
    }
  });

  // 3. Progress (account for overtime AND briefing-task drag)
  pols.forEach(pol => {
    if (pol.awaitingHMT) return;
    if (needsSubmission(pol)) return;
    let gain = 0;
    const isOvertimeStage = pol.overtimeStages[pol.stage];
    staff.forEach(st => {
      const a = st.assignments.find(x => x.policyId === pol.id && x.transit === 0);
      if (!a) return;
      const essential   = isEssentialNow(st.type, pol);
      const isSupport   = a.isSupport === true;
      if (!essential && !isSupport) return;
      const rate = essential ? 1.0 : 0.5;
      const contributing = st.assignments.filter(x => {
        if (x.transit > 0) return false;
        const p = pols.find(pp => pp.id === x.policyId);
        return p && (isEssentialNow(st.type, p) || x.isSupport === true);
      }).length;
      // Briefing tasks drag down contribution proportionally
      const cap = effectiveCapacity(st, day);
      const taskDrag = Math.min(0.9, briefingTaskLoad(st) / cap);
      const effectiveRate = rate * (1 - taskDrag);
      gain += effectiveRate * (100 / STAGE_WORK) / Math.max(1, contributing);
    });
    if (isOvertimeStage) gain *= OVERTIME_SPEEDUP;
    pol.progress += gain;
  });

  // 4. Reclassification
  pols.forEach(pol => {
    if (pol.stage !== 0 || pol.condition || pol.awaitingHMT) return;
    if (pol.progress < 25 || pol.progress > 85) return;
    if (Math.random() < RECLASSIFY_P) {
      pol.condition = pick([CONDITIONS.HOT_POTATO, CONDITIONS.RED_TAPE]);
      log = [{ text:`${pol.name} — research surfaced complications. Reclassified as ${pol.condition.label}.`, tag:"⚠ Reclassified", type:"warn" }, ...log];
      const newType = essentialType(pol, pol.stage);
      staff.forEach(st => {
        if (st.type === "Policy Officer") return;
        if (st.type !== newType) st.assignments = st.assignments.filter(a => a.policyId !== pol.id);
      });
      if (newType !== "Policy Officer" && !staff.some(st => st.type === newType && st.assignments.some(a => a.policyId === pol.id))) {
        const h = findHandler(newType, staff, pol, pols, day);
        if (h) h.assignments.push({ policyId: pol.id, transit: TRANSIT_SWAP });
      }
      addModal({ type:"routing", policyId:pol.id, kind:"reclassified" });
    }
  });

  // 5. Stage advancement
  const completedIds = [];
  pols.forEach(pol => {
    if (pol.awaitingHMT) return;
    if (pol.progress < 99.9) return;

    // Apply overtime finishing fatigue if this stage was overtime
    if (pol.overtimeStages[pol.stage]) {
      applyOvertimeFinish(staff, pol, day);
    }

    if (pol.stage === 0 && pol.condition?.id === "CONSULTATION") pol.consulted = true;

    if (pol.stage === 2) {
      const htmResult = calculateHMT(pol);
      pol.awaitingHMT = true;
      addModal({ type:"htmResponse", policyId:pol.id, ...htmResult });
      return;
    }

    if (pol.stage >= 3) {
      completedIds.push(pol.id);
      return;
    }

    staff.forEach(st => {
      if (st.type !== "Policy Officer") {
        st.assignments = st.assignments.filter(a => a.policyId !== pol.id);
      } else {
        st.assignments = st.assignments.filter(a => a.policyId !== pol.id || !a.isSupport);
      }
    });
    pol.stage++;
    pol.progress = 0;
    const newType = essentialType(pol, pol.stage);
    if (newType !== "Policy Officer") {
      const h = findHandler(newType, staff, pol, pols, day);
      if (h) h.assignments.push({ policyId: pol.id, transit: TRANSIT_IDLE });
      else log = [{ text:`${pol.name} now at ${STAGES[pol.stage]}, but no ${newType} available.`, tag:"⚠ Stalled", type:"warn" }, ...log];
    }
    if (pol.supportConfig[pol.stage]) tryAddSupportPO(pol, staff, pols, day);
    if (needsSubmission(pol)) addModal({ type:"submission", policyId:pol.id, stage:needsSubmission(pol) });
  });

  // 6. Completions → implementation done → goes live → deferred Trust applied here
  completedIds.forEach(id => {
    const pol = pols.find(p => p.id === id);
    if (!pol) return;
    done++;
    const { impl, run } = calcCosts(pol);
    res.programmeBudget = cl(res.programmeBudget - impl);
    res.confidence      = cl(res.confidence + 8);

    // Deferred submission impacts on Trust (both gains and losses) land NOW
    const devTone = pol.submissions.development;
    const sigTone = pol.submissions.signoff;
    let totalDeferredTrust = 0;
    [devTone, sigTone].forEach(t => {
      if (!t) return;
      totalDeferredTrust += SUBMISSION_TONES[t].deferredTrust || 0;
    });

    // Apply secrecy multiplier — Level 3 sees no public Trust effects;
    // Level 2 sees muted impact; Levels 0–1 see full impact
    const secrecyMult = pol.secrecy === 3 ? 0
                      : pol.secrecy === 2 ? 0.4
                      : 1.0;
    const baseCompletionTrust = 4 * secrecyMult;
    const appliedDeferredTrust = totalDeferredTrust * secrecyMult;
    res.trust = cl(res.trust + baseCompletionTrust + appliedDeferredTrust);

    // Level 3 modest extra Confidence — the Minister appreciates discretion
    if (pol.secrecy === 3) res.confidence = cl(res.confidence + 2);

    // Robustness assessment for wellbeing impact
    const isRobust = (devTone === "FRANK" || devTone === "CAUTIOUS")
                  && (sigTone === "FRANK" || sigTone === "CAUTIOUS")
                  && totalDeferredTrust >= 0;
    const isWeak   = devTone === "REASSURING" || sigTone === "REASSURING" || totalDeferredTrust < 0;

    // Find lead PO (non-support shadowing PO)
    const leadPO = staff.find(st =>
      st.type === "Policy Officer" &&
      st.assignments.some(a => a.policyId === id && !a.isSupport));

    // Apply wellbeing effects to all currently-assigned staff
    staff.forEach(st => {
      const a = st.assignments.find(x => x.policyId === id);
      if (!a) return;
      if (isRobust) {
        if (leadPO && st.id === leadPO.id) {
          st.wellbeing = cl(st.wellbeing + WELLBEING_ROBUST_LEAD);
        } else {
          st.wellbeing = cl(st.wellbeing + WELLBEING_ROBUST_DELIV);
        }
      } else if (isWeak) {
        st.wellbeing = cl(st.wellbeing + WELLBEING_WEAK_DELIV);
      }
    });

    // Compute decay multiplier from submission tones
    let decayMult = 1.0;
    if (sigTone) decayMult *= SUBMISSION_TONES[sigTone].decayMultiplier;
    if (devTone === "REASSURING") decayMult *= 1.5;
    if (devTone === "CAUTIOUS" && pol.condition && (pol.condition.id === "HOT_POTATO" || pol.condition.id === "RED_TAPE")) {
      decayMult *= 1.25;
    }
    if (sigTone === "CAUTIOUS" && pol.condition && (pol.condition.id === "HOT_POTATO" || pol.condition.id === "RED_TAPE")) {
      decayMult *= 1.25;
    }
    // Cap multiplier so it can't get out of hand
    decayMult = Math.min(decayMult, 2.5);

    // Create live portfolio entry
    live.push({
      id: `live-${id}`,
      name: pol.name,
      leadPOId: leadPO?.id || null,
      health: 100,
      runningCost: run,
      decayMultiplier: decayMult,
      isWeak,
      secrecy: pol.secrecy || 0,
      nextDrain:   day + LIVE_DRAIN_PERIOD,
      nextTopup:   day + LIVE_TOPUP_PERIOD,
      nextDecay:   day + LIVE_DECAY_PERIOD,
      nextLeakCheck: day + SECRET_LEAK_CHECK_EVERY,
      issueRaised: false,
    });

    // Detach all from pipeline; attach lead PO to monitoring
    staff.forEach(st => { st.assignments = st.assignments.filter(a => a.policyId !== id); });
    if (leadPO) {
      leadPO.assignments.push({ policyId: `live-${id}`, transit: 0, isMonitoring: true });
    }

    // Deferred-trust modal if there was a meaningful Trust event
    if (totalDeferredTrust !== 0 && pol.secrecy !== 3) {
      addModal({
        type:"deferredTrust",
        policyName: pol.name,
        amount: appliedDeferredTrust,
        devTone, sigTone,
        decayMult,
        leadName: leadPO?.name || null,
        secrecy: pol.secrecy,
      });
    }

    log = [{ text:`${pol.name} — implemented. Now live. Lead: ${leadPO?.name || "unassigned"}.`, tag:"✓ Live", type:"success" }, ...log];

    // Launch press clippings (skip Level 3 secret policies)
    if (pol.secrecy !== 3) {
      const isSpecial = !!pol.condition;
      const isPositive = appliedDeferredTrust >= 0;
      const isBig = isSpecial || pol.condition?.id === "MINISTERS_PET";
      const outlets = isSpecial
        ? ["Daily Mail","The Guardian","Civil Service World","Twitter / X"]
        : ["Daily Mail","The Guardian","Civil Service World"];
      const voices = {
        "Daily Mail":       isPositive ? `${pol.name} has launched — but is it the government distraction critics warned about?` : `Botched rollout: ${pol.name} already attracting complaints.`,
        "The Guardian":     isPositive ? `${pol.name}: a measured first step, though questions remain on equity of access.` : `${pol.name} implementation raises concerns among civil society groups.`,
        "Civil Service World": isPositive ? `${pol.name} delivered on schedule following standard departmental process.` : `${pol.name} delivery noted. Select Committee has written to the department.`,
        "Twitter / X":      isPositive ? `ok but has anyone actually TRIED the ${pol.name.split(" ")[0]} thing yet because` : `lmao ${pol.name.split(" ")[0]} is a disaster already and it's day one`,
      };
      outlets.forEach(outlet => {
        pressCards.push({
          id:`press-launch-${id}-${outlet}`,
          source:"PRESS",
          outlet,
          headline: voices[outlet] || `${pol.name} now live.`,
          body:"",
          impact: appliedDeferredTrust !== 0 ? (appliedDeferredTrust > 0 ? `+${appliedDeferredTrust.toFixed(0)} Trust (launch)` : `${appliedDeferredTrust.toFixed(0)} Trust (launch)`) : "",
          expires: day + LAUNCH_PRESS_TTL,
          severe: !isPositive && isSpecial,
        });
      });

      // PS trigger: first live policy — prompt to hire correspondence drafter if no CD
      const hasCD = staff.some(st => st.type === "Correspondence Drafter");
      if (!psTriggered.firstLive && !hasCD) {
        psTriggered = { ...psTriggered, firstLive: true };
        psHandlingManually = true;
        psHandlingDrainNext = day + 5;
        psCards.push({
          id:`ps-firstlive-${day}`,
          text:`We have started receiving correspondence about ${pol.name}. Nothing serious yet, but it will grow. We do not currently have anyone dedicated to handling it. I am managing it manually for now, but you should consider hiring a Correspondence Drafter.`,
          buttonLabel:"Begin recruitment",
          buttonAction:"hireCD",
          expires: 999,
        });
      }
    }
    spadNotifs = spadNotifs.filter(n => n.policyId !== id);
  });
  pols = pols.filter(p => !completedIds.includes(p.id));
  while (pols.length < 3 && done < 7) pols.push(randomPolicy());

  // 7. Live portfolio maintenance
  live.forEach(lp => {
    if (day >= lp.nextDrain) {
      res.programmeBudget = cl(res.programmeBudget - lp.runningCost);
      lp.nextDrain = day + LIVE_DRAIN_PERIOD;
    }
    if (day >= lp.nextTopup) {
      res.programmeBudget = cl(res.programmeBudget + lp.runningCost);
      lp.nextTopup = day + LIVE_TOPUP_PERIOD;
    }
    if (day >= lp.nextDecay) {
      lp.health = Math.max(0, lp.health - LIVE_DECAY * (lp.decayMultiplier || 1));
      lp.nextDecay = day + LIVE_DECAY_PERIOD;
    }
    if (lp.health <= LIVE_ISSUE_HEALTH && !lp.issueRaised && pols.length < INBOX_CAP) {
      const issuePol = mkPol(
        `${lp.name} — Delivery Issue`,
        Math.random() < 0.5 ? CONDITIONS.HOT_POTATO : CONDITIONS.CONSULTATION,
        0, 0, false, null, null, lp.secrecy || 0
      );
      pols.push(issuePol);
      const po = findHandlerForced("Policy Officer", staff, pols);
      if (po) po.assignments.push({ policyId: issuePol.id, transit: TRANSIT_IDLE });
      const essType = essentialType(issuePol, 0);
      if (essType !== "Policy Officer") {
        const h = findHandler(essType, staff, issuePol, pols, day);
        if (h) h.assignments.push({ policyId: issuePol.id, transit: TRANSIT_IDLE });
      }
      lp.health      = LIVE_ISSUE_RESET;
      lp.issueRaised = true;

      // Lead PO of the live policy takes a wellbeing hit
      if (lp.leadPOId) {
        const lead = staff.find(s => s.id === lp.leadPOId);
        if (lead) lead.wellbeing = cl(lead.wellbeing + WELLBEING_ISSUE);
      }

      addModal({ type:"routing", policyId:issuePol.id, kind:"new" });
      log = [{ text:`Issue arising from ${lp.name}. New policy in inbox.`, tag:"⚠ BAU Issue", type:"warn" }, ...log];
    }
    if (lp.issueRaised && lp.health >= LIVE_RECOVER_AT) lp.issueRaised = false;

    // Secret-policy leak check (Level 2/3 only)
    if ((lp.secrecy === 2 || lp.secrecy === 3) && day >= lp.nextLeakCheck) {
      if (Math.random() < SECRET_LEAK_PROB) {
        const trustHit = lp.secrecy === 3 ? -18 : -10;
        const confHit  = lp.secrecy === 3 ? -8 : -5;
        res.trust      = cl(res.trust + trustHit);
        res.confidence = cl(res.confidence + confHit);
        pressCards.push({
          id:`press-leak-${day}-${lp.id}`,
          source: "PRESS",
          outlet: lp.secrecy === 3 ? "The Guardian" : "The Times",
          headline: lp.secrecy === 3 ? "SECRET PROGRAMME EXPOSED" : "Quiet government initiative comes to light",
          body: `The existence of ${lp.name}, ${lp.secrecy === 3 ? "previously unacknowledged" : "previously kept under wraps"}, has been revealed${lp.secrecy === 3 ? " through what appears to be a whistleblower disclosure" : ""}. Officials are scrambling to manage the fallout.`,
          impact: `Trust ${trustHit} · Confidence ${confHit}`,
          expires: day + PRESS_TTL,
          severe: true,
        });
        addModal({ type:"leakStory", outlet: pressCards[pressCards.length-1].outlet,
          headline: pressCards[pressCards.length-1].headline,
          body: pressCards[pressCards.length-1].body,
          trustHit, confHit });
        log = [{ text:`LEAK: ${lp.name} exposed. ${trustHit} Trust, ${confHit} Confidence.`, tag:"⚠ LEAK", type:"warn" }, ...log];
      }
      lp.nextLeakCheck = day + SECRET_LEAK_CHECK_EVERY;
    }
  });

  // 7b. Pending Perm Sec leaks
  pendingLeaks = pendingLeaks.filter(leak => {
    if (day >= leak.fireOn) {
      const isTabloid = Math.random() < 0.5;
      const trustHit  = isTabloid ? -7 : -4;
      const confHit   = -PERMSEC_LEAK_CONF_HIT;
      res.trust       = cl(res.trust + trustHit);
      res.confidence  = cl(res.confidence + confHit);
      pressCards.push({
        id:`press-permsec-${day}`,
        source: "PRESS",
        outlet: isTabloid ? "Daily Mail" : "The Times",
        headline: isTabloid ? "MINISTER LOSES FAITH IN MANDARINS" : "Department turmoil: Permanent Secretary 'forced to intervene'",
        body: isTabloid
          ? `Insiders say Robert Hartley has been left exasperated by his own officials, requiring his Permanent Secretary to step in. "It's chaos in there," one source claims.`
          : `Whitehall sources have confirmed that the Permanent Secretary has had to manage relations between the Secretary of State and his department directly.`,
        impact: `Trust ${trustHit} · Confidence ${confHit}`,
        expires: day + PRESS_TTL,
        severe: true,
      });
      addModal({ type:"leakStory", outlet: isTabloid ? "Daily Mail" : "The Times",
        headline: pressCards[pressCards.length-1].headline,
        body: pressCards[pressCards.length-1].body,
        trustHit, confHit });
      log = [{ text:`LEAK: Perm Sec story in ${isTabloid?"the Mail":"The Times"}. ${trustHit} Trust.`, tag:"⚠ LEAK", type:"warn" }, ...log];
      return false;
    }
    return true;
  });

  // 7c. Pending FOI story checks
  pendingFOIs = pendingFOIs.filter(foi => {
    if (day >= foi.fireOn) {
      if (Math.random() < foi.storyProb) {
        const trustHit = -Math.round(foi.severity);
        res.trust      = cl(res.trust + trustHit);
        pressCards.push({
          id:`press-foi-${day}-${foi.targetName}`,
          source: "PRESS",
          outlet: foi.severity >= 8 ? "Daily Mail" : "The Guardian",
          headline: foi.severity >= 8 ? "DEPARTMENT KNEW ALL ALONG" : "FOI reveals delays in flagship programme",
          body: `Documents released under Freedom of Information show ${foi.targetName} has been ${foi.severity >= 8 ? "beset by problems the department privately acknowledged while publicly downplaying them" : "moving more slowly than ministers admitted in public"}.`,
          impact: `Trust ${trustHit}`,
          expires: day + PRESS_TTL,
          severe: foi.severity >= 8,
        });
        log = [{ text:`FOI story on ${foi.targetName} (${trustHit} Trust).`, tag:"⚠ Press", type:"warn" }, ...log];
      } else {
        log = [{ text:`FOI response on ${foi.targetName} attracted no coverage.`, tag:"FOI", type:"event" }, ...log];
      }
      return false;
    }
    return true;
  });

  // 7d. FOI request generation
  if (day >= nextFOI && pols.length > 0) {
    const eligible = pols.filter(p => (p.secrecy || 0) === 0);
    if (eligible.length > 0) {
      const target = pick(eligible);
      foiQueue.push({
        id:`foi-${day}`,
        targetPolicyId: target.id,
        targetName: target.name,
        requester: pick(["D. Smithers (Guardian)","R. Patel (BBC)","J. Cole (Daily Mail)","M. Ellison (FT)"]),
      });
      // Trigger modal if free, otherwise let it sit in queue (we'll auto-fire later)
      addModal({ type:"foiRequest", foiId: foiQueue[foiQueue.length-1].id,
        targetPolicyId: target.id, targetName: target.name,
        requester: foiQueue[foiQueue.length-1].requester });
      log = [{ text:`FOI request received re: ${target.name}.`, tag:"FOI", type:"event" }, ...log];
    }
    nextFOI = day + FOI_INTERVAL_MIN + Math.floor(Math.random() * (FOI_INTERVAL_MAX - FOI_INTERVAL_MIN));
  }

  // 7e. Hiring completion check
  if (hiring && day >= hiring.startDay + RECRUITMENT_DAYS) {
    // Recruitment complete — show applicant selection modal
    addModal({ type:"applicants", role: hiring.role, applicants: hiring.applicants });
    hiring = null;
  }

  // 7f. PS manual handling drain (before CD is hired)
  const hasCD = staff.some(st => st.type === "Correspondence Drafter");
  if (psHandlingManually && !hasCD && day >= psHandlingDrainNext) {
    // Small PO capacity drain — PS is handling correspondence manually
    const pos = staff.filter(st => st.type === "Policy Officer");
    if (pos.length > 0) {
      const po = pos[Math.floor(Math.random() * pos.length)];
      if (!po.briefingTasks) po.briefingTasks = [];
      po.briefingTasks.push({ daysLeft: 1, label: "correspondence (PS handling)" });
    }
    psHandlingDrainNext = day + 5;
  }
  if (hasCD) psHandlingManually = false;

  // 7g. Correspondence generation
  if (hasCD || psHandlingManually) {
    // Easy correspondence
    if (day >= nextCorrEasy && correspondence.filter(c => c.difficulty === "easy").length < 3) {
      const livePols = live.filter(lp => lp.health > 0);
      if (livePols.length > 0) {
        const lp = pick(livePols);
        const isMP = Math.random() < 0.15;
        correspondence.push({
          id:`corr-easy-${day}`,
          source: isMP ? "MP" : "public",
          difficulty: "easy",
          policyId: lp.id,
          policyName: lp.name,
          sender: isMP ? pick(MP_NAMES) : "Member of the public",
          text: isMP
            ? `Asking for an update on the progress and outcomes of ${lp.name} on behalf of constituents.`
            : `Enquiry received regarding ${lp.name} — general information request.`,
          expires: day + CORR_EASY_EXPIRY,
          leadPOId: lp.leadPOId,
        });
        log = [{ text:`Easy correspondence re: ${lp.name}.`, tag:"📬 Post", type:"event" }, ...log];
      }
      nextCorrEasy = day + CORR_EASY_INT_MIN + Math.floor(Math.random() * (CORR_EASY_INT_MAX - CORR_EASY_INT_MIN));
      // Scale down interval if more live policies
      if (live.length >= 3) nextCorrEasy = Math.round(nextCorrEasy * 0.75);
    }
    // Medium correspondence
    if (day >= nextCorrMed && correspondence.filter(c => c.difficulty === "medium").length < 2) {
      const livePols = live.filter(lp => lp.health > 0);
      if (livePols.length > 0) {
        const lp = pick(livePols);
        const isMP = Math.random() < 0.4;
        const isStakeholder = !isMP && Math.random() < 0.4;
        correspondence.push({
          id:`corr-med-${day}`,
          source: isMP ? "MP" : isStakeholder ? "stakeholder" : "public",
          difficulty: "medium",
          policyId: lp.id,
          policyName: lp.name,
          sender: isMP ? pick(MP_NAMES) : isStakeholder ? pick(STAKEHOLDERS) : "Concerned member of the public",
          text: isMP
            ? `Raising specific questions about the implementation of ${lp.name} in their constituency and requesting a substantive response.`
            : isStakeholder
            ? `${pick(STAKEHOLDERS)} has written seeking detailed clarification on aspects of ${lp.name} relevant to their membership.`
            : `A detailed letter regarding the personal impact of ${lp.name}, requiring a substantive reply.`,
          expires: day + CORR_MED_EXPIRY,
          leadPOId: lp.leadPOId,
        });
        log = [{ text:`Medium correspondence re: ${lp.name}.`, tag:"📬 Post", type:"event" }, ...log];
      }
      nextCorrMed = day + CORR_MED_INT + Math.floor(Math.random() * 5);
    }
    // Hard correspondence
    if (day >= nextCorrHard && correspondence.filter(c => c.difficulty === "hard").length < 1) {
      const livePols = live.filter(lp => lp.health > 0);
      if (livePols.length > 0) {
        const lp = pick(livePols);
        const isMP = Math.random() < 0.55;
        const isStakeholder = !isMP && Math.random() < 0.5;
        correspondence.push({
          id:`corr-hard-${day}`,
          source: isMP ? "MP" : isStakeholder ? "stakeholder" : "public",
          difficulty: "hard",
          policyId: lp.id,
          policyName: lp.name,
          sender: isMP ? pick(MP_NAMES) : isStakeholder ? pick(STAKEHOLDERS) : "Campaign group representative",
          text: isMP
            ? `A substantive letter raising parliamentary concerns about ${lp.name}, requiring a ministerially cleared response.`
            : isStakeholder
            ? `A formal representation from ${pick(STAKEHOLDERS)} regarding ${lp.name}, requiring policy-level engagement.`
            : `A complex complaint regarding ${lp.name} that falls outside standard lines.`,
          expires: day + CORR_HARD_EXPIRY,
          leadPOId: lp.leadPOId,
        });
        addModal({ type:"hardCorrespondence", corrId: correspondence[correspondence.length-1].id });
        log = [{ text:`Hard correspondence re: ${lp.name} — decision required.`, tag:"📬 Post", type:"warn" }, ...log];
      }
      nextCorrHard = day + CORR_HARD_INT + Math.floor(Math.random() * 7);
    }
  }

  // 7g-ii. Auto-route Easy/Medium correspondence when CD is active
  if (hasCD) {
    const cd = staff.find(st => st.type === "Correspondence Drafter" && !st.pending);
    const toAutoRoute = correspondence.filter(c => c.difficulty !== "hard");
    if (cd && toAutoRoute.length > 0) {
      toAutoRoute.forEach(c => {
        if (!cd.briefingTasks) cd.briefingTasks = [];
        if (c.difficulty === "easy") {
          cd.briefingTasks.push({ daysLeft: 1, label: `easy corr: ${c.policyName.slice(0,20)}` });
          log = [{ text:`Easy corr re: ${c.policyName} — routed to ${cd.name}.`, tag:"📬 Auto", type:"event" }, ...log];
        } else {
          cd.briefingTasks.push({ daysLeft: 2, label: `med corr: ${c.policyName.slice(0,20)}` });
          applyBriefingTask(staff, pols, { poId: c.leadPOId, days: 1, label: `corr input: ${c.policyName.slice(0,20)}` });
          log = [{ text:`Medium corr re: ${c.policyName} — routed to ${cd.name} + policy lead.`, tag:"📬 Auto", type:"event" }, ...log];
        }
      });
      correspondence = correspondence.filter(c => c.difficulty === "hard");
    }
  }

  // 7h. Correspondence lapse
  const lapsedCorr = correspondence.filter(c => day >= c.expires);
  lapsedCorr.forEach(c => {
    if (c.difficulty === "hard" && c.source === "MP") {
      res.trust      = cl(res.trust      + CORR_TRUST_MP_LAPSE);
      res.confidence = cl(res.confidence + CORR_CONF_MP_LAPSE);
      log = [{ text:`Hard MP correspondence from ${c.sender} lapsed unanswered. ${CORR_TRUST_MP_LAPSE} Trust, ${CORR_CONF_MP_LAPSE} Confidence.`, tag:"📬 Lapsed", type:"warn" }, ...log];
    } else if (c.difficulty === "hard") {
      res.trust = cl(res.trust + CORR_TRUST_LAPSE);
      log = [{ text:`Hard correspondence re: ${c.policyName} lapsed unanswered. ${CORR_TRUST_LAPSE} Trust.`, tag:"📬 Lapsed", type:"warn" }, ...log];
    } else if (c.difficulty === "medium") {
      res.trust = cl(res.trust - 1);
      log = [{ text:`Medium correspondence re: ${c.policyName} went unanswered. −1 Trust.`, tag:"📬 Lapsed", type:"warn" }, ...log];
    }
  });
  correspondence = correspondence.filter(c => day < c.expires);

  // 8. Hot Potato drain
  if (day >= nextHot) {
    const hots = pols.filter(p => p.condition?.id === "HOT_POTATO");
    if (hots.length > 0) {
      const d = 3 * hots.length;
      res.confidence = cl(res.confidence - d);
      log = [{ text:`Hot Potato pressure building. −${d} Confidence.`, tag:"Hot Potato", type:"warn" }, ...log];
    }
    nextHot = day + 5;
  }

  // 9. Minister's Pet drain
  if (day === 35) nextPet = 35;
  if (day >= 35 && day >= nextPet) {
    const pets = pols.filter(p => p.condition?.id === "MINISTERS_PET");
    if (pets.length > 0) {
      const d = 3 * pets.length;
      res.confidence = cl(res.confidence - d);
      log = [{ text:`Minister's Pet unresolved. −${d} Confidence.`, tag:"Minister", type:"warn" }, ...log];
    }
    nextPet = day + 4;
  }

  // 10. Passive admin drain
  if (day % 14 === 0) res.adminBudget = cl(res.adminBudget - 2);

  // 11. Random events
  if (day >= nextEvent) {
    if (Math.random() < 0.45) {
      const ev = pick(EVENTS);
      res = ev.fn(res);
      log = [{ text:ev.text, tag:ev.tag, type:"event" }, ...log];
    }
    nextEvent = day + 7 + Math.floor(Math.random() * 5);
  }

  // 12. New policy arrival
  if (day >= nextArrival && pols.length < INBOX_CAP) {
    const newPol = randomPolicy();
    pols.push(newPol);
    const po = findHandlerForced("Policy Officer", staff, pols);
    if (po) po.assignments.push({ policyId: newPol.id, transit: TRANSIT_IDLE });
    const essType = essentialType(newPol, 0);
    if (essType !== "Policy Officer") {
      const h = findHandler(essType, staff, newPol, pols, day);
      if (h) h.assignments.push({ policyId: newPol.id, transit: TRANSIT_IDLE });
    }
    log = [{ text:`New policy: ${newPol.name}${newPol.condition ? ` — flagged ${newPol.condition.label}` : ""}.`, tag:"📋 New", type:"intro" }, ...log];
    nextArrival = day + ARRIVAL_MIN + Math.floor(Math.random() * (ARRIVAL_MAX - ARRIVAL_MIN));
    addModal({ type:"routing", policyId:newPol.id, kind:"new" });
  }

  // 13. PO coverage
  staff = ensurePOCoverage(staff, pols);

  // 14. Monthly bilateral
  if (day >= nextMeeting) {
    addModal({ type:"meeting", day });
    nextMeeting = day + MEETING_INTERVAL;
  }

  // 15. Ministerial steer (frequency shortens in low-Confidence bands)
  if (day >= nextSteer && pols.length > 0) {
    const steer = steerForState(pols, res.confidence);
    addModal({ ...steer, type:"steer" });
    const band = confidenceBand(res.confidence);
    const intMin = band === "crisis" ? Math.round(STEER_INT_MIN * 0.5)
                 : band === "uneasy" ? Math.round(STEER_INT_MIN * 0.7)
                 : STEER_INT_MIN;
    const intMax = band === "crisis" ? Math.round(STEER_INT_MAX * 0.5)
                 : band === "uneasy" ? Math.round(STEER_INT_MAX * 0.7)
                 : STEER_INT_MAX;
    nextSteer = day + intMin + Math.floor(Math.random() * Math.max(1, intMax - intMin));
  }

  // 16. SpAd intervention (more frequent in low-Confidence bands)
  if (day >= nextSpad && pols.length > 0 && spadNotifs.length < 3) {
    const intv = spadIntervention(pols, day, res.confidence);
    if (intv) {
      spadNotifs.push(intv);
      log = [{ text:`${SPAD.name}: "${intv.text.slice(0,60)}…"`, tag:"SpAd", type:"event" }, ...log];
    }
    const band = confidenceBand(res.confidence);
    const intMin = band === "crisis" ? Math.round(SPAD_INT_MIN * 0.6)
                 : band === "uneasy" ? Math.round(SPAD_INT_MIN * 0.8)
                 : SPAD_INT_MIN;
    const intMax = band === "crisis" ? Math.round(SPAD_INT_MAX * 0.6)
                 : band === "uneasy" ? Math.round(SPAD_INT_MAX * 0.8)
                 : SPAD_INT_MAX;
    nextSpad = day + intMin + Math.floor(Math.random() * Math.max(1, intMax - intMin)) + spadEscalations * 6;
  }

  log = log.slice(0, 14);

  // 17. Win/loss
  const won  = done >= 7;
  const dead = day >= TOTAL_DAYS;
  const lost = res.adminBudget <= 0 || res.programmeBudget <= 0 || res.confidence <= 0 || res.trust <= 0 || dead;
  let outcome = s.outcome, outcomeMsg = s.outcomeMsg;
  if (won)       { outcome = "won";      outcomeMsg = pick(OUTCOMES.won); }
  else if (lost) {
    if      (dead)                     outcome = "deadline";
    else if (res.adminBudget <= 0)     outcome = "admin";
    else if (res.programmeBudget <= 0) outcome = "programme";
    else if (res.confidence <= 0)      outcome = "confidence";
    else                               outcome = "trust";
    outcomeMsg = pick(OUTCOMES[outcome]);
  }

  // Auto-pause when a modal opens, remember previous speed
  const fullQueue   = [...s.modalQueue, ...newModals];
  const resolved    = pendingModal || (fullQueue.length > 0 ? fullQueue.shift() : null);
  const willPause   = won || lost || resolved;
  let nextSpeed     = s.speed;
  let nextPrevSpeed = s.prevSpeed;
  if (willPause && s.speed !== "pause") {
    nextPrevSpeed = s.speed;
    nextSpeed     = "pause";
  }

  return {
    ...s, day, res, staff, policies:pols, livePortfolio:live, completed:done, log,
    nextEvent, nextHot, nextPet, nextArrival, nextMeeting, nextSteer, nextSpad,
    spadNotifs, spadEscalations,
    pendingLeaks, pendingFOIs, foiQueue, pressCards, bilateralPenalty, nextFOI,
    psCards, psTriggered, hiring, correspondence,
    nextCorrEasy, nextCorrMed, nextCorrHard,
    psHandlingManually, psHandlingDrainNext,
    modalQueue:    resolved ? fullQueue : [],
    activeModal:   resolved,
    speed:         nextSpeed,
    prevSpeed:     nextPrevSpeed,
    gameOver:      won || lost,
    outcome,       outcomeMsg,
  };
}

function SpeedBtn({ label, val, current, onClick, dev = false }) {

// ── Pipeline component ────────────────────────────────────────────────────────
function Pipeline({ policy, staff }) {
  const assigned = staff.filter(st => st.assignments.some(a => a.policyId === policy.id));
  const subPend  = needsSubmission(policy);
  return (
    <div style={{ display:"flex", gap:3, marginTop:8 }}>
      {STAGES.map((_, i) => {
        const isComplete = i < policy.stage;
        const isCurrent  = i === policy.stage;
        const here       = assigned.filter(st => {
          const a = st.assignments.find(x => x.policyId === policy.id);
          return a && a.transit === 0;
        });
        const essT  = essentialType(policy, i);
        const active   = isCurrent ? here.filter(st => st.type === essT) : [];
        const hasPO    = isCurrent ? here.some(st => st.type === "Policy Officer") : false;
        const subBlock = isCurrent && subPend;
        const hmtWait  = isCurrent && policy.awaitingHMT;
        const blocked  = isCurrent && !subBlock && !hmtWait && (active.length === 0 || !hasPO);
        const sc       = policy.condition?.color || C.green;
        const overtime = policy.overtimeStages && policy.overtimeStages[i];
        return (
          <div key={i} style={{
            flex:1, borderRadius:3, overflow:"hidden", position:"relative",
            border:`1px solid ${isComplete ? sc+"70" : isCurrent ? sc : C.faint}`,
            background: isComplete ? sc+"22" : "#0e160e", height:34,
          }}>
            {overtime && (
              <div style={{
                position:"absolute", top:2, right:3, fontSize:9, color:C.pink, zIndex:2,
                textShadow:"0 0 3px black",
              }}>🌙</div>
            )}
            {isCurrent && !hmtWait && (
              <div style={{
                position:"absolute", top:0, left:0, height:"100%",
                width:`${Math.min(100, policy.progress)}%`,
                background: (blocked||subBlock) ? C.red+"40" : overtime ? C.pink+"45" : sc+"35",
                transition:"width 0.4s",
              }} />
            )}
            <div style={{ position:"absolute", inset:0, display:"flex",
              flexDirection:"column", alignItems:"center", justifyContent:"center", gap:1, zIndex:1 }}>
              <div style={{
                fontSize:8, letterSpacing:0.5,
                color: isComplete ? sc : isCurrent ? C.text : C.faint,
                fontWeight: isCurrent ? "bold" : "normal",
              }}>{isComplete ? "✓ " : ""}{STAGE_SHORT[i]}</div>
              {hmtWait && <div style={{ fontSize:7, color:C.amber }}>HMT review</div>}
              {subBlock && !hmtWait && <div style={{ fontSize:7, color:C.purple }}>awaiting brief</div>}
              {isCurrent && !subBlock && !hmtWait && !blocked && policy.progress > 5 && (
                <div style={{ fontSize:7, color:sc }}>{Math.min(99,Math.round(policy.progress))}%</div>
              )}
              {blocked && <div style={{ fontSize:7, color:C.red }}>idle</div>}
            </div>
          </div>
        );
      })}
    </div>
  );
}

// ── HMT modal ─────────────────────────────────────────────────────────────────
function HTMModal({ modal, policy, onConfirm }) {
  if (!policy) return null;
  const { response, rejectedTo, amount } = modal;
  const col = response === "approved" ? C.green
            : response === "within"   ? C.amber : C.red;
  const headline = response === "approved" ? "BID APPROVED"
                 : response === "within"   ? "APPROVED — WITHIN EXISTING BUDGET"
                 : "BID RETURNED";
  const body = response === "approved"  ? HMT_TEXT.approved(policy.name, amount)
             : response === "within"    ? HMT_TEXT.within(policy.name)
             : rejectedTo === 0         ? HMT_TEXT.rejected_0()
             : rejectedTo === 1         ? HMT_TEXT.rejected_1()
             :                            HMT_TEXT.rejected_2();
  const stageNames = ["Research","Development","Sign-Off"];
  return (
    <ModalShell border={col}>
      <ML color={col}>🏛 HM TREASURY RESPONSE — {headline}</ML>
      <div style={{ fontSize:13,color:C.text,fontWeight:"bold",marginBottom:10 }}>{policy.name}</div>
      {response === "approved" && (
        <div style={{ fontSize:11,color:C.green,marginBottom:10 }}>+£{amount}m to Programme Budget</div>
      )}
      {response === "rejected" && (
        <div style={{ fontSize:11,color:C.red,marginBottom:10 }}>Returned to: {stageNames[rejectedTo]}</div>
      )}
      <div style={{ background:"#0c140c",border:`1px solid ${col}40`,
        borderRadius:3,padding:"12px 14px",marginBottom:18 }}>
        <div style={{ fontSize:11,color:C.text,lineHeight:1.8,fontStyle:"italic" }}>"{body}"</div>
      </div>
      <div style={{ display:"flex",justifyContent:"flex-end" }}>
        <MB onClick={onConfirm} colour={col}>NOTED</MB>
      </div>
    </ModalShell>
  );
}

// ── Main component ────────────────────────────────────────────────────────────
function Whitehall() {
  const [st, set] = useState(init);

  useEffect(() => {
    if (st.speed === "pause" || st.gameOver || st.activeModal) return;
    const ms = st.speed === "dev"  ? Math.round(TICK_MS / 10)
             : st.speed === "fast" ? Math.round(TICK_MS / 3)
             : TICK_MS;
    const id = setInterval(() =>
      set(s => (s.speed === "pause" || s.gameOver || s.activeModal) ? s : tick(s)), ms);
    return () => clearInterval(id);
  }, [st.speed, st.gameOver, st.activeModal]);

  const setSpeed = v => set(s => s.gameOver ? s : { ...s, speed:v, prevSpeed:v });
  const selectPolicy = id => set(s => ({ ...s, selected: s.selected === id ? null : id }));

  // Resume after closing a modal: pop next from queue OR restore prevSpeed
  function popQueueOrResume(s, updates = {}) {
    const q = s.modalQueue;
    if (q.length > 0) {
      return { ...s, ...updates, activeModal:q[0], modalQueue:q.slice(1) };
    }
    // No more modals — resume previous speed
    return { ...s, ...updates, activeModal:null, modalQueue:[], speed: s.prevSpeed || "play" };
  }

  function onRoutingConfirm(toggles) {
    set(s => {
      const m = s.activeModal;
      if (!m || m.type !== "routing") return popQueueOrResume(s);
      let policies = s.policies.map(p => p.id !== m.policyId ? p : { ...p, supportConfig:[...toggles] });
      let staff    = s.staff.map(st => ({ ...st,
        assignments:st.assignments.map(a=>({...a})),
        briefingTasks:(st.briefingTasks||[]).map(t=>({...t})),
      }));
      const pol    = policies.find(p => p.id === m.policyId);
      if (pol && toggles[pol.stage]) {
        staff.forEach(st => {
          if (st.type !== "Policy Officer") return;
          st.assignments = st.assignments.filter(a => a.policyId !== pol.id || !a.isSupport);
        });
        tryAddSupportPO(pol, staff, policies, s.day);
      }
      return popQueueOrResume(s, { policies, staff });
    });
  }

  function onSubmissionChoose(key) {
    set(s => {
      const m    = s.activeModal;
      const tone = SUBMISSION_TONES[key];
      const pols = s.policies.map(p => p.id !== m.policyId ? p
        : { ...p, submissions:{ ...p.submissions, [m.stage]:key } });
      // Only Confidence applies immediately. Trust impact is deferred to implementation.
      const res  = { ...s.res, confidence:cl(s.res.confidence + tone.confidence) };
      const name = s.policies.find(p => p.id === m.policyId)?.name || "policy";
      const log  = [{ text:`${name} — submission filed (${tone.label}). ${tone.result}`, tag:tone.label, type:"event" }, ...s.log].slice(0,14);
      return popQueueOrResume(s, { policies:pols, res, log });
    });
  }

  function onHTMConfirm() {
    set(s => {
      const m   = s.activeModal;
      const pol = s.policies.find(p => p.id === m.policyId);
      if (!pol) return popQueueOrResume(s);
      let res  = { ...s.res };
      let pols = s.policies.map(p => ({ ...p }));
      let staff = s.staff.map(st => ({ ...st,
        assignments:st.assignments.map(a=>({...a})),
        briefingTasks:(st.briefingTasks||[]).map(t=>({...t})),
      }));
      let log  = [...s.log];
      const target = pols.find(p => p.id === m.policyId);
      if (m.response === "approved") {
        res.programmeBudget = cl(res.programmeBudget + m.amount);
        advanceToImpl(target, staff, pols, s.day);
        log = [{ text:`HMT approved ${target.name}. +£${m.amount}m programme. Proceeding to Implementation.`, tag:"✓ HMT", type:"success" }, ...log];
      } else if (m.response === "within") {
        advanceToImpl(target, staff, pols, s.day);
        log = [{ text:`HMT approved ${target.name} within existing budget.`, tag:"HMT", type:"event" }, ...log];
      } else {
        target.awaitingHMT = false;
        target.stage       = m.rejectedTo;
        target.progress    = 0;
        staff.forEach(st => {
          if (st.type !== "Policy Officer") {
            st.assignments = st.assignments.filter(a => a.policyId !== target.id);
          } else {
            st.assignments = st.assignments.filter(a => a.policyId !== target.id || !a.isSupport);
          }
        });
        const newType = essentialType(target, target.stage);
        if (newType !== "Policy Officer") {
          const h = findHandler(newType, staff, target, pols, s.day);
          if (h) h.assignments.push({ policyId:target.id, transit:TRANSIT_IDLE });
        }
        log = [{ text:`HMT returned ${target.name} to ${STAGES[m.rejectedTo]}. Bid must be revised.`, tag:"✗ HMT", type:"warn" }, ...log];
      }
      log = log.slice(0,14);
      return popQueueOrResume(s, { policies:pols, staff, res, log });
    });
  }

  function onDeferredTrustClose() { set(s => popQueueOrResume(s)); }

  function onMeetingClose(dConf) {
    set(s => {
      const totalConf = dConf - s.bilateralPenalty;
      const res = { ...s.res, confidence:cl(s.res.confidence + totalConf) };
      const staff = s.staff.map(st => ({ ...st,
        assignments:st.assignments.map(a=>({...a})),
        briefingTasks:(st.briefingTasks||[]).map(t=>({...t})),
      }));
      const pos = staff.filter(st => st.type === "Policy Officer");
      pos.sort((a,b) => (a.briefingTasks?.length||0) - (b.briefingTasks?.length||0));
      pos.slice(0, 2).forEach(po => {
        po.briefingTasks.push({ daysLeft: TASK_MEETING_PREP, label: "meeting prep" });
      });
      const penaltyNote = s.bilateralPenalty > 0
        ? ` (incl. −${s.bilateralPenalty} for Perm Sec involvement)` : "";
      const log = [{ text:`Monthly bilateral. ${totalConf>=0?"+":""}${totalConf} Confidence${penaltyNote}.`, tag:"Meeting", type:"event" }, ...s.log].slice(0,14);
      return popQueueOrResume(s, { res, staff, log, bilateralPenalty: 0 });
    });
  }

  function onSteerChoose(opt) {
    set(s => {
      const res = { ...s.res,
        confidence:cl(s.res.confidence+(opt.confidence||0)),
        trust:     cl(s.res.trust     +(opt.trust     ||0)) };
      // Apply briefing task if any
      let staff = s.staff;
      if (opt.task) {
        staff = s.staff.map(st => ({ ...st,
          assignments:st.assignments.map(a=>({...a})),
          briefingTasks:(st.briefingTasks||[]).map(t=>({...t})),
        }));
        applyBriefingTask(staff, s.policies, opt.task);
      }
      const log = [{ text:opt.log, tag:"Steer", type:"event" }, ...s.log].slice(0,14);

  function onFOIChoose(choice) {
    set(s => {
      const m = s.activeModal;
      if (!m || m.type !== "foiRequest") return popQueueOrResume(s);
      const pol = s.policies.find(p => p.id === m.targetPolicyId);
      // Compute story probability based on policy state
      let prob = FOI_BASE_PROB;
      let severity = 4;
      if (pol) {
        const reassured = pol.submissions.development === "REASSURING" || pol.submissions.signoff === "REASSURING";
        const frank = pol.submissions.development === "FRANK" || pol.submissions.signoff === "FRANK";
        if (reassured)                                     { prob *= 2;   severity += 4; }
        if (pol.condition?.id === "HOT_POTATO")            { prob *= 1.5; severity += 2; }
        if (pol.stage > 0 && pol.progress < 10)            { prob *= 1.5; severity += 1; }
        if (frank && !reassured)                           { prob *= 0.75; }
      }
      // Apply choice modifier
      let immediateTrust = 0;
      let taskDays = 1;
      if (choice === "redact")  { prob *= 0.5;  taskDays = 2; }
      if (choice === "refuse")  { prob *= 0.15; taskDays = 3; immediateTrust = -3; }
      prob = Math.min(0.8, prob);

      // Add briefing task to a PO
      const staff = s.staff.map(st => ({ ...st,
        assignments:st.assignments.map(a=>({...a})),
        briefingTasks:(st.briefingTasks||[]).map(t=>({...t})),
      }));
      applyBriefingTask(staff, s.policies, { poId: m.targetPolicyId, days: taskDays, label: "FOI response" });

      const res = { ...s.res, trust: cl(s.res.trust + immediateTrust) };
      const pendingFOIs = [...s.pendingFOIs, {
        fireOn: s.day + FOI_DELAY_MIN + Math.floor(Math.random() * (FOI_DELAY_MAX - FOI_DELAY_MIN)),
        targetName: m.targetName,
        storyProb: prob,
        severity,
      }];
      const choiceLabel = choice === "redact" ? "redacted" : choice === "refuse" ? "refused" : "released in full";
      const log = [{ text:`FOI on ${m.targetName} — ${choiceLabel}. ${(prob*100).toFixed(0)}% story risk.`, tag:"FOI", type:"event" }, ...s.log].slice(0,14);
      return popQueueOrResume(s, { staff, res, pendingFOIs, log });
    });
  }

  function requestPermSec() {
    set(s => {
      if (s.gameOver) return s;
      if (s.permSecCooldownUntil && s.day < s.permSecCooldownUntil) return s;
      const willLeak = Math.random() < PERMSEC_LEAK_PROB;
      const pendingLeaks = [...s.pendingLeaks];
      if (willLeak) {
        const delay = PERMSEC_LEAK_DELAY_MIN + Math.floor(Math.random() * (PERMSEC_LEAK_DELAY_MAX - PERMSEC_LEAK_DELAY_MIN));
        pendingLeaks.push({ fireOn: s.day + delay });
      }
      return { ...s,
        res:{ ...s.res, confidence: cl(s.res.confidence + PERMSEC_CONF_BOOST) },
        nextSteer: Math.max(s.nextSteer, s.day + PERMSEC_STEER_DELAY),
        permSecCooldownUntil: s.day + PERMSEC_COOLDOWN,
        pendingLeaks,
        bilateralPenalty: s.bilateralPenalty + PERMSEC_BILATERAL_HIT,
        log:[{ text:`Asked the Perm Sec to have a quiet word. +${PERMSEC_CONF_BOOST} Confidence.`, tag:"Perm Sec", type:"event" }, ...s.log].slice(0,14),
      };
    });
  }

  function toggleOvertime() {
    set(s => {
      if (!s.selected || s.gameOver) return s;
      const pol = s.policies.find(p => p.id === s.selected);
      if (!pol) return s;
      const stage = pol.stage;
      if (pol.awaitingHMT) return s;
      const currentlyOn = pol.overtimeStages[stage];
      if (!currentlyOn) {
        // Turn on — costs admin budget, applies wellbeing hit immediately
        if (s.res.adminBudget < OVERTIME_COST) return s;
        const staff = s.staff.map(st => ({ ...st,
          assignments:st.assignments.map(a=>({...a})),
          briefingTasks:(st.briefingTasks||[]).map(t=>({...t})),
        }));
        applyOvertimeStart(staff, pol);
        const policies = s.policies.map(p => {
          if (p.id !== s.selected) return p;
          const newStages = [...p.overtimeStages];
          newStages[stage] = true;
          return { ...p, overtimeStages:newStages };
        });
        return {
          ...s,
          res:{ ...s.res, adminBudget:s.res.adminBudget - OVERTIME_COST },
          staff, policies,
          log:[{ text:`Overtime authorised for ${pol.name} at ${STAGES[stage]}. −${OVERTIME_COST} Admin.`, tag:"🌙 Overtime", type:"event" }, ...s.log].slice(0,14),
        };

      return s;  // can't toggle off once on (the money is spent)

      const m      = staff.find(st => st.id === staffId);
      if (!m) return s;
      const pol    = s.policies.find(p => p.id === s.selected);
      if (!pol) return s;
      const exists = m.assignments.find(a => a.policyId === s.selected);

          const otherPOs = staff.filter(o => o.id !== m.id && o.type === "Policy Officer"
            && o.assignments.some(a => a.policyId === s.selected));
          if (!otherPOs.length) return s;
        }
        m.assignments = m.assignments.filter(a => a.policyId !== s.selected);
      } else {
        const load = staffLoad(m, s.policies);
        if (load + assignmentWeight(m.type, pol) > effectiveCapacity(m, s.day)) return s;
        const alreadyHasPO = m.type === "Policy Officer" && staff.some(o =>
          o.id !== m.id && o.type === "Policy Officer" &&

        m.assignments.push({
          policyId: s.selected,
          transit: m.assignments.length > 0 ? TRANSIT_SWAP : TRANSIT_IDLE,
          isSupport: alreadyHasPO,
        });
      }
      return { ...s, staff };
    });
  }
